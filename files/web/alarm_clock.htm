<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alarm Clock | Stargate Command</title>
  <style>
    :root {
      --text: #eef3f7;
      --muted: #9aa8b4;
      --cyan2: #6cefff;
      --gold: #ffd86a;
      --gold-soft: rgba(255, 216, 106, 0.72);
      --gold-dim: rgba(255, 216, 106, 0.20);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-image: url('img/background.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* PANEL UNDER THE CLOCK */
    .top-panel {
      position: absolute;
      top: clamp(10px, 1.6vw, 20px);
      left: clamp(10px, 1.6vw, 20px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 0.8vw, 10px);
      width: clamp(170px, 22vw, 300px);
      transform: translateY(0) scale(1);
      transform-origin: top left;
      transition:
        transform 0.28s ease,
        filter 0.28s ease,
        opacity 0.22s ease;
    }

    /* PANEL POPS ABOVE CLOCK ONLY ON HOVER / FOCUS */
    .top-panel:hover,
    .top-panel:focus-within {
      z-index: 50;
      transform: translateY(-14px) scale(1.04);
      filter: drop-shadow(0 0 18px rgba(108,239,255,0.22));
    }

    .top-panel-section {
      padding: clamp(8px, 1vw, 12px);
      border: 1px solid rgba(55,191,222,0.35);
      border-radius: clamp(8px, 1vw, 10px);
      background: rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      opacity: 0.58;
      transition:
        opacity 0.22s ease,
        transform 0.22s ease,
        box-shadow 0.22s ease,
        background 0.22s ease;
    }

    .top-panel-section:hover,
    .top-panel-section:focus-within {
      opacity: 0.96;
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(55,191,222,0.18);
    }

    .panel-title {
      color: #92ddff;
      font-size: clamp(10px, 0.9vw, 12px);
      letter-spacing: 1.1px;
      text-transform: uppercase;
      margin-bottom: clamp(6px, 0.7vw, 8px);
      text-shadow: 0 0 10px rgba(108,239,255,0.16);
    }

    .panel-btn-stack {
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 0.7vw, 8px);
    }

    .panel-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(6px, 0.7vw, 8px);
    }

    .panel-btn {
      min-height: clamp(30px, 3.6vw, 42px);
      border: 1px solid rgba(55,191,222,0.32);
      border-radius: clamp(6px, 0.8vw, 8px);
      color: #eef3f7;
      font-size: clamp(11px, 1vw, 14px);
      cursor: pointer;
      transition: 0.14s ease;
      background: rgba(36, 43, 50, 0.42);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.07),
        inset 0 -8px 14px rgba(0,0,0,0.18);
    }

    .panel-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
      background: rgba(48, 58, 68, 0.56);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.07),
        inset 0 -8px 14px rgba(0,0,0,0.18),
        0 0 10px rgba(108,239,255,0.12);
    }

    .panel-btn.active,
    .panel-btn.primary {
      background: rgba(52, 78, 105, 0.56);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -8px 14px rgba(0,0,0,0.20),
        0 0 12px rgba(108,239,255,0.14);
    }

    .audio-file {
      margin-top: 8px;
      min-height: 20px;
      color: #9fdff8;
      font-size: clamp(10px, 0.95vw, 13px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .alarm-time-big {
      color: var(--cyan2);
      font-size: clamp(20px, 2.4vw, 38px);
      line-height: 1;
      text-shadow: 0 0 12px rgba(108,239,255,0.22);
      font-weight: 700;
      margin-top: 2px;
    }

    .alarm-time-label {
      color: var(--muted);
      font-size: clamp(10px, 0.95vw, 13px);
      margin-top: 8px;
    }

    /* CLOCK ABOVE PANEL */
    .face-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(116vw, 116vh);
      height: min(116vw, 116vh);
      transform: translate(-50%, -50%);
      z-index: 30;
      pointer-events: none;
    }

    #alarmSvg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: none;
      filter: drop-shadow(0 22px 34px rgba(0,0,0,0.38));
    }

    /* INVISIBLE CLOCK SHIELD BLOCKS PANEL HOVER UNDER THE CLOCK */
    #clockShield circle {
      pointer-events: all;
      fill: rgba(0,0,0,0.001);
    }

    /* ONLY REAL CLOCK PARTS CAN CLICK */
    .seg,
    .center-button {
      pointer-events: all;
      cursor: pointer;
    }

    @keyframes alarmGoldBlink {
      0%, 100% {
        stroke: rgba(255, 216, 106, 0.96);
        stroke-width: 2.6;
        filter: drop-shadow(0 0 5px rgba(255,216,106,0.55))
                drop-shadow(0 0 14px rgba(255,170,60,0.38));
      }
      50% {
        stroke: rgba(255, 216, 106, 0.18);
        stroke-width: 1.3;
        filter: none;
      }
    }

    @keyframes alarmLabelBlink {
      0%, 100% {
        fill: #ffd86a;
        opacity: 1;
        text-shadow: 0 0 8px rgba(255,216,106,0.60);
      }
      50% {
        fill: #b79e57;
        opacity: 0.35;
        text-shadow: none;
      }
    }

    .seg-shape {
      pointer-events: visiblePainted;
      fill: url(#segFill);
      stroke: rgba(255,255,255,0.08);
      stroke-width: 1.1;
      transition: 0.16s ease;
    }

    .minute-minor .seg-shape {
      fill: url(#segMinorFill);
    }

    .seg:hover .seg-shape {
      stroke: rgba(255,215,120,0.85);
      stroke-width: 1.8;
      filter:
        brightness(1.06)
        drop-shadow(0 0 6px rgba(255,215,120,0.30));
    }

    /* User-selected segment while setting */
    .seg.active .seg-shape {
      fill: url(#activeFill);
      stroke: rgba(255,255,255,0.95);
      stroke-width: 2.2;
      filter:
        url(#glowFilter)
        drop-shadow(0 0 5px rgba(100,240,255,0.65))
        drop-shadow(0 0 16px rgba(20,199,240,0.42));
    }

    /* Live current hour/minute: gold outline + gold number, no special fill */
    .seg.current-time .seg-shape {
      fill: url(#segFill);
      stroke: rgba(255,216,106,0.96);
      stroke-width: 2.3;
      filter:
        drop-shadow(0 0 5px rgba(255,216,106,0.50))
        drop-shadow(0 0 14px rgba(255,170,60,0.26));
    }

    .minute-minor.current-time .seg-shape {
      fill: url(#segMinorFill);
    }

    .seg.current-time .label {
      fill: #ffd86a;
      stroke: rgba(55, 32, 0, 0.82);
      filter: drop-shadow(0 0 6px rgba(255,216,106,0.45));
    }

    /* Alarm: blinking outline only, number stays solid gold */
    .seg.alarm-time .seg-shape {
      fill: url(#segFill);
      animation: alarmGoldBlink 10s ease-in-out infinite;
    }

    .minute-minor.alarm-time .seg-shape {
      fill: url(#segMinorFill);
    }

    .seg.alarm-time .label {
      stroke: rgba(55, 32, 0, 0.82);
      fill: #ffd86a;
      animation: none !important;
      filter: none;
    }

    /* If current time overlaps alarm -> still blink */
    .seg.current-time.alarm-time .seg-shape {
      fill: url(#segFill);
      animation: alarmGoldBlink 10s ease-in-out infinite;
    }

    .minute-minor.current-time.alarm-time .seg-shape {
      fill: url(#segMinorFill);
    }

    .seg.current-time.alarm-time .label {
      stroke: rgba(55, 32, 0, 0.82);
      fill: #ffd86a;
      animation: none !important;
      filter: none;
    }

    .label {
      fill: #f4f8fb;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      paint-order: stroke fill;
      stroke: rgba(0,0,0,0.62);
      stroke-width: 2px;
      letter-spacing: 0.2px;
      transition: 0.16s ease;
    }

    .center-button {
      transition: 0.12s ease;
    }

    .center-button:hover {
      filter: brightness(1.08);
    }

    .center-button circle {
      pointer-events: visiblePainted;
      filter:
        drop-shadow(0 0 10px rgba(255,70,70,0.58))
        drop-shadow(0 0 24px rgba(255,0,0,0.28));
    }

    @media (max-aspect-ratio: 1/1) {
      .face-wrap {
        width: 112vw;
        height: 112vh;
      }
    }

    @media (max-width: 900px) {
      .top-panel-section {
        opacity: 0.48;
      }

      .top-panel:hover,
      .top-panel:focus-within {
        transform: translateY(-12px) scale(1.03);
      }

      .face-wrap {
        width: 120vw;
        height: 120vh;
      }
    }

    @media (max-width: 700px) {
      .top-panel {
        width: clamp(150px, 30vw, 220px);
      }

      .top-panel-section {
        opacity: 0.36;
      }

      .top-panel:hover,
      .top-panel:focus-within {
        transform: translateY(-9px) scale(1.02);
      }

      .face-wrap {
        width: 126vw;
        height: 126vh;
      }
    }

    @media (max-width: 520px) {
      .top-panel {
        width: clamp(135px, 34vw, 190px);
      }

      .top-panel-section {
        opacity: 0.28;
      }

      .top-panel:hover,
      .top-panel:focus-within {
        transform: translateY(-7px) scale(1.015);
      }

      .face-wrap {
        width: 132vw;
        height: 132vh;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="top-panel">
      <div class="top-panel-section">
        <div class="panel-btn-stack">
          <button class="panel-btn" onclick="goBack()">← Return</button>
        </div>
      </div>

      <div class="top-panel-section">
        <div class="panel-title">Audio</div>
        <div class="panel-btn-stack">
          <button class="panel-btn" id="audioSelectBtn">Select File</button>
          <div class="audio-file" id="audioDisplay">No file selected</div>
        </div>
      </div>

      <div class="top-panel-section">
        <div class="panel-title">Meridiem</div>
        <div class="panel-btn-row">
          <button class="panel-btn" id="amBtn">AM</button>
          <button class="panel-btn" id="pmBtn">PM</button>
        </div>
      </div>

      <div class="top-panel-section">
        <div class="panel-title">Control</div>
        <div class="panel-btn-row">
          <button class="panel-btn" id="testBtn">Test ON/OFF</button>
          <button class="panel-btn primary" id="confirmBtn">Confirm</button>
        </div>
      </div>

      <div class="top-panel-section">
        <div class="panel-title">Alarm Time</div>
        <div class="alarm-time-big" id="alarmTime">--:-- --</div>
        <div class="alarm-time-label" id="statusLine">Select hour, minute and mode</div>
      </div>
    </div>

    <div class="face-wrap">
      <svg id="alarmSvg" viewBox="0 0 1000 1000" aria-label="DHD Alarm Clock">
        <defs>
          <filter id="metalNoise" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"></feTurbulence>
            <feColorMatrix in="noise" type="saturate" values="0"></feColorMatrix>
            <feComponentTransfer>
              <feFuncA type="table" tableValues="0 0.035"></feFuncA>
            </feComponentTransfer>
          </filter>

          <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feOffset dx="0" dy="2"></feOffset>
            <feGaussianBlur stdDeviation="3" result="offset-blur"></feGaussianBlur>
            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"></feComposite>
            <feFlood flood-color="black" flood-opacity="0.34" result="color"></feFlood>
            <feComposite operator="in" in="color" in2="inverse" result="shadow"></feComposite>
            <feComposite operator="over" in="shadow" in2="SourceGraphic"></feComposite>
          </filter>

          <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.2" result="blur"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>

          <radialGradient id="bodyFill" cx="50%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#737a82"></stop>
            <stop offset="18%" stop-color="#5b6169"></stop>
            <stop offset="52%" stop-color="#3a4047"></stop>
            <stop offset="82%" stop-color="#23282e"></stop>
            <stop offset="100%" stop-color="#15191e"></stop>
          </radialGradient>

          <linearGradient id="bodyHighlight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.11)"></stop>
            <stop offset="30%" stop-color="rgba(255,255,255,0.02)"></stop>
            <stop offset="100%" stop-color="rgba(0,0,0,0.18)"></stop>
          </linearGradient>

          <linearGradient id="segFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6d737b"></stop>
            <stop offset="25%" stop-color="#555b63"></stop>
            <stop offset="62%" stop-color="#3b4048"></stop>
            <stop offset="100%" stop-color="#282d34"></stop>
          </linearGradient>

          <linearGradient id="segMinorFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#60666d"></stop>
            <stop offset="100%" stop-color="#20252b"></stop>
          </linearGradient>

          <linearGradient id="activeFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b6ffff"></stop>
            <stop offset="28%" stop-color="#6cefff"></stop>
            <stop offset="72%" stop-color="#2fd2f1"></stop>
            <stop offset="100%" stop-color="#0f89a6"></stop>
          </linearGradient>

          <linearGradient id="currentTimeFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e3ffff"></stop>
            <stop offset="28%" stop-color="#91f8ff"></stop>
            <stop offset="72%" stop-color="#29dbff"></stop>
            <stop offset="100%" stop-color="#0b8fbf"></stop>
          </linearGradient>

          <linearGradient id="alarmTimeFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff5a1f"></stop>
            <stop offset="50%" stop-color="#ff2e00"></stop>
            <stop offset="100%" stop-color="#a30000"></stop>
          </linearGradient>

          <radialGradient id="centerFill" cx="50%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#ffb3b3"></stop>
            <stop offset="25%" stop-color="#ff6666"></stop>
            <stop offset="70%" stop-color="#cb2525"></stop>
            <stop offset="100%" stop-color="#720909"></stop>
          </radialGradient>
        </defs>

        <g id="clockBase"></g>
        <g id="clockShield">
          <circle cx="500" cy="500" r="360"></circle>
        </g>
        <g id="minuteRing"></g>
        <g id="hourRing"></g>
        <g id="centerGroup"></g>
      </svg>
    </div>
  </div>

  <script>
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/retro/dial.html";
      }
    }
  </script>

  <script src="js/alarm_clock.js"></script>
</body>
</html>
